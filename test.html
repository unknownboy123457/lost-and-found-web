<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LFIS Test Suite</title>
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <script src="assets/js/jquery-3.6.4.min.js"></script>
  <script src="database/schema.js"></script>
  <script src="database/seed.js"></script>
  <script src="database/db.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/categories.js"></script>
  <script src="scripts/items.js"></script>
  <script src="scripts/notifications.js"></script>
  <script src="scripts/claims.js"></script>
  <script src="scripts/inquiries.js"></script>
  <script src="scripts/admin.js"></script>
  <script src="scripts/app.js"></script>
</head>
<body class="p-4 bg-light">
  <div class="container">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Lost & Found JavaScript + IndexedDB Automated Test Suite</h4>
        <button id="run-btn" class="btn btn-light btn-sm fw-bold">Re-run Tests</button>
      </div>
      <div class="card-body">
        <div class="alert alert-info py-2" id="summary">Running tests...</div>
        <table class="table table-bordered table-striped" id="test-table">
          <thead>
            <tr>
              <th style="width: 50px;">#</th>
              <th>Test Case</th>
              <th style="width: 120px;">Status</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="test-results"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const tests = [
      {
        name: 'IndexedDB Initialization and Seeding',
        run: async () => {
          await window.db.init();
          const cats = await window.db.getAll('category_list');
          const items = await window.db.getAll('item_list');
          const inqs = await window.db.getAll('inquiry_list');
          const users = await window.db.getAll('users');
          const info = await window.db.getSystemInfo();

          if (cats.length < 3) throw new Error('Expected at least 3 categories, got ' + cats.length);
          if (items.length < 4) throw new Error('Expected at least 4 items, got ' + items.length);
          if (inqs.length < 1) throw new Error('Expected at least 1 inquiry, got ' + inqs.length);
          if (users.length < 2) throw new Error('Expected at least 2 users, got ' + users.length);
          if (!info.name || !info.short_name) throw new Error('System info missing name or short_name');
          return `Seeded: ${cats.length} categories, ${items.length} items, ${users.length} users, ${inqs.length} inquiries`;
        }
      },
      {
        name: 'Authentication: Admin Login with Username & Password',
        run: async () => {
          const res = await window.AuthManager.login('admin', 'admin123');
          if (res.status !== 'success') throw new Error('Admin login failed: ' + res.msg);
          if (!window.AuthManager.isAdmin()) throw new Error('User is not identified as Admin');
          return `Logged in as ${res.user.username} (type: ${res.user.type})`;
        }
      },
      {
        name: 'Authentication: Admin Login with Email & Password',
        run: async () => {
          const res = await window.AuthManager.login('admin@lostandfound.com', 'admin123');
          if (res.status !== 'success') throw new Error('Admin email login failed: ' + res.msg);
          if (!window.AuthManager.isAdmin()) throw new Error('User is not identified as Admin');
          return `Logged in via email: ${res.user.email}`;
        }
      },
      {
        name: 'Authentication: Invalid Password Rejection',
        run: async () => {
          const res = await window.AuthManager.login('admin', 'wrong_pass_123');
          if (res.status === 'success') throw new Error('Invalid login should have failed');
          return 'Correctly rejected invalid credentials with error: ' + res.msg;
        }
      },
      {
        name: 'Authentication: Non-Existent Email / Account Rejection',
        run: async () => {
          const res = await window.AuthManager.login('nobody_exists_12345@domain.com', 'password123');
          if (res.status === 'success') throw new Error('Login with non-existent email should have failed');
          return 'Correctly rejected non-existent email with message: ' + res.msg;
        }
      },
      {
        name: 'Authentication: User Registration with Name, Email & Password',
        run: async () => {
          const rand = Date.now();
          const testEmail = `user_${rand}@campus.edu`;
          const testUsername = `user_${rand}`;
          const res = await window.AuthManager.register({
            firstname: 'Sarah',
            lastname: 'Connor',
            email: testEmail,
            username: testUsername,
            password: 'securepassword123',
            confirm_password: 'securepassword123'
          });
          if (res.status !== 'success') throw new Error(res.msg);
          if (Number(res.user.type) !== 2) throw new Error('Public registrant must be regular user (type 2)');
          return `Registered account for ${testEmail} with ID #${res.user.id}`;
        }
      },
      {
        name: 'Authentication: Duplicate Email Registration Rejection',
        run: async () => {
          const duplicateEmail = `dup_${Date.now()}@campus.edu`;
          await window.AuthManager.register({
            firstname: 'Initial',
            lastname: 'User',
            email: duplicateEmail,
            username: 'init_' + Date.now(),
            password: 'password123'
          });
          const dupRes = await window.AuthManager.register({
            firstname: 'Impostor',
            lastname: 'User',
            email: duplicateEmail,
            username: 'impostor_' + Date.now(),
            password: 'password456'
          });
          if (dupRes.status === 'success') throw new Error('Duplicate email registration should have failed');
          return 'Correctly rejected duplicate email: ' + dupRes.msg;
        }
      },
      {
        name: 'Authentication: Password Mismatch Rejection on Registration',
        run: async () => {
          const res = await window.AuthManager.register({
            firstname: 'Mismatch',
            lastname: 'Tester',
            email: `mismatch_${Date.now()}@campus.edu`,
            password: 'passwordABC',
            confirm_password: 'passwordXYZ'
          });
          if (res.status === 'success') throw new Error('Mismatched passwords should have failed');
          return 'Correctly rejected mismatching passwords: ' + res.msg;
        }
      },
      {
        name: 'Authentication: Login Using Newly Registered Email & Password',
        run: async () => {
          const regEmail = `login_test_${Date.now()}@example.com`;
          await window.AuthManager.register({
            firstname: 'Login',
            lastname: 'Tester',
            email: regEmail,
            username: 'logintest_' + Date.now(),
            password: 'myPassword123'
          });
          const loginRes = await window.AuthManager.login(regEmail, 'myPassword123');
          if (loginRes.status !== 'success') throw new Error('Login failed with registered email: ' + loginRes.msg);
          return `Successfully authenticated user ${loginRes.user.firstname} via email ${regEmail}`;
        }
      },
      {
        name: 'Authentication: Session Persistence Across Refreshes (Storage Sync)',
        run: async () => {
          const cur = window.AuthManager.getCurrentUser();
          if (!cur) throw new Error('Expected active session user');
          // Simulate tab refresh by clearing sessionStorage and reading from localStorage
          sessionStorage.removeItem('lfis_user_session');
          const rehydrated = window.AuthManager.getCurrentUser();
          if (!rehydrated) throw new Error('Session failed to re-hydrate from persistent storage');
          if (rehydrated.id !== cur.id) throw new Error('Rehydrated user ID mismatch');
          return `Session verified & persisted across storage re-hydration for user #${rehydrated.id}`;
        }
      },
      {
        name: 'Authentication: Logout & Re-authentication Lifecycle',
        run: async () => {
          // Clear session
          sessionStorage.removeItem('lfis_user_session');
          localStorage.removeItem('lfis_user_session');
          if (window.AuthManager.getCurrentUser() !== null) throw new Error('Session should be null after logout');

          // Log back in
          const relogin = await window.AuthManager.login('admin', 'admin123');
          if (relogin.status !== 'success') throw new Error('Re-login failed after logout');
          return 'Logout cleanly removed storage; subsequent login re-established session';
        }
      },
      {
        name: 'Authentication: Admin Protection & Regular User Privilege Separation',
        run: async () => {
          // Register regular user
          const reg = await window.AuthManager.register({
            firstname: 'Regular',
            lastname: 'Citizen',
            email: `regular_${Date.now()}@example.com`,
            username: 'reg_' + Date.now(),
            password: 'userpass123'
          });
          // Verify regular user is NOT admin
          if (window.AuthManager.isAdmin()) throw new Error('Regular user must not have isAdmin=true');

          // Verify database check: regular user cannot access admin
          const dbUser = await window.db.getById('users', reg.user.id);
          if (Number(dbUser.type) === 1) throw new Error('Regular user must not have type=1 in database');

          return 'Admin portal protection confirmed: Regular user has type 2 and is blocked from admin access';
        }
      },
      {
        name: 'Categories: List and Filter Active',
        run: async () => {
          const allCats = await window.CategoryManager.getAll(false);
          const activeCats = await window.CategoryManager.getAll(true);
          if (!Array.isArray(allCats) || allCats.length === 0) throw new Error('No categories found');
          return `Found ${allCats.length} total categories (${activeCats.length} active)`;
        }
      },
      {
        name: 'Categories: Add, Update, and Delete CRUD',
        run: async () => {
          const addRes = await window.CategoryManager.save({
            name: 'Test Category ' + Date.now(),
            description: '<p>Test description</p>',
            status: 1
          });
          if (addRes.status !== 'success') throw new Error(addRes.msg);

          const fetched = await window.CategoryManager.getById(addRes.sid);
          if (!fetched) throw new Error('Failed to fetch newly added category');

          const updateRes = await window.CategoryManager.save({
            id: addRes.sid,
            name: fetched.name + ' Updated',
            description: '<p>Updated description</p>',
            status: 0
          });
          if (updateRes.status !== 'success') throw new Error(updateRes.msg);

          const delRes = await window.CategoryManager.delete(addRes.sid);
          if (delRes.status !== 'success') throw new Error(delRes.msg);

          const postDel = await window.CategoryManager.getById(addRes.sid);
          if (postDel) throw new Error('Category still exists after deletion');
          return 'Add, update, and delete executed successfully';
        }
      },
      {
        name: 'Items: Query and Filtering by Category',
        run: async () => {
          const allItems = await window.ItemManager.getAll();
          const catItems = await window.ItemManager.getAll({ categoryId: 1 });
          if (!Array.isArray(allItems)) throw new Error('Item list is not an array');
          return `Total items: ${allItems.length}, Category 1 items: ${catItems.length}`;
        }
      },
      {
        name: 'Items: Search by Keyword',
        run: async () => {
          const results = await window.ItemManager.getAll({ query: 'Park' });
          if (results.length === 0) throw new Error('Search for "Park" should return Central Park keys');
          return `Search for "Park" returned item: "${results[0].title}"`;
        }
      },
      {
        name: 'Items: Public Found Item Report Submission',
        run: async () => {
          const res = await window.ItemManager.save({
            founder: true,
            category_id: 1,
            fullname: 'Public Citizen',
            title: 'Lost Backpack at Library',
            contact: '09991234567',
            description: 'Black backpack left on study desk 4',
            image_path: ''
          });
          if (res.status !== 'success') throw new Error(res.msg);

          const item = await window.ItemManager.getById(res.iid);
          if (Number(item.status) !== 0) throw new Error('Founder submitted item must be pending (status 0)');
          return `Item created with id ${res.iid} and verified as Pending (status 0)`;
        }
      },
      {
        name: 'Items: Admin Status Update (Approve -> Claim)',
        run: async () => {
          const addRes = await window.ItemManager.save({
            category_id: 2,
            fullname: 'Admin Tester',
            title: 'Status Test Item',
            contact: '123456',
            description: 'Testing status transitions',
            status: 0
          });

          await window.ItemManager.updateStatus(addRes.iid, 1); // Published
          let item = await window.ItemManager.getById(addRes.iid);
          if (Number(item.status) !== 1) throw new Error('Expected status 1 (Published)');

          await window.ItemManager.updateStatus(addRes.iid, 2); // Claimed
          item = await window.ItemManager.getById(addRes.iid);
          if (Number(item.status) !== 2) throw new Error('Expected status 2 (Claimed)');

          await window.ItemManager.delete(addRes.iid);
          return 'Item successfully transitioned from Pending -> Published -> Claimed';
        }
      },
      {
        name: 'Inquiries: Submit and Mark Read',
        run: async () => {
          const res = await window.InquiryManager.save({
            visitor: true,
            fullname: 'Inquiry Tester',
            contact: '555-0199',
            email: 'testinquiry@example.com',
            message: 'Have you found a blue wallet?'
          });
          if (res.status !== 'success') throw new Error(res.msg);

          // Fetch inquiry and verify marked as read
          const inq = await window.InquiryManager.getById(res.id, true);
          if (Number(inq.status) !== 1) throw new Error('Viewing inquiry should mark it as read (status 1)');

          await window.InquiryManager.delete(res.id);
          return 'Inquiry submitted, marked as read, and cleaned up';
        }
      },
      {
        name: 'Dashboard: Metrics Calculation',
        run: async () => {
          const stats = await window.AdminManager.getDashboardStats();
          if (typeof stats.activeCategories !== 'number' || typeof stats.pendingItems !== 'number') {
            throw new Error('Stats format invalid');
          }
          return `Active Cats: ${stats.activeCategories}, Pending Items: ${stats.pendingItems}, Published: ${stats.publishedItems}`;
        }
      },
      {
        name: 'System Info: Update Settings & Pages',
        run: async () => {
          const original = await window.db.getSystemInfo();
          await window.AdminManager.updatePageContent('about', '<p>Test about content update</p>');
          const updated = await window.db.getSystemInfo();
          if (updated.about !== '<p>Test about content update</p>') throw new Error('Page content update did not persist');

          // Restore original
          await window.AdminManager.updatePageContent('about', original.about);
          return 'Page content update and persistence verified';
        }
      },
      {
        name: 'Image Storage: Validation & Resolution',
        run: async () => {
          const fakeFile = new File(['dummy content'], 'test.png', { type: 'image/png' });
          const val = window.StorageManager.validateImage(fakeFile);
          if (!val.valid) throw new Error('PNG file should be valid');

          const badFile = new File(['dummy content'], 'test.exe', { type: 'application/x-msdownload' });
          const badVal = window.StorageManager.validateImage(badFile);
          if (badVal.valid) throw new Error('EXE file should be rejected');

          const url = window.StorageManager.getImageUrl('uploads/logo.png?v=123', 'uploads/logo.png', '../');
          if (url !== '../uploads/logo.png') throw new Error('Image URL resolution unexpected: ' + url);

          return 'Validation and URL resolution functioning properly';
        }
      },
      {
        name: 'Found Items: Multi-Photo, Location, and Date Persistence',
        run: async () => {
          const res = await window.ItemManager.save({
            founder: true,
            user_id: 101,
            category_id: 1,
            fullname: 'Campus Security Officer',
            title: 'Found Smartwatch in Gym Locker',
            contact: '555-4321',
            item_date: '2026-11-24',
            location: 'Gymnasium Locker Room B',
            description: 'Black smartwatch with silicone strap found inside locker 14',
            images: ['data:image/png;base64,photo1data', 'data:image/png;base64,photo2data'],
            image_path: 'data:image/png;base64,photo1data'
          });
          if (res.status !== 'success') throw new Error(res.msg);

          const item = await window.ItemManager.getById(res.iid);
          if (!item) throw new Error('Item not found after creation');
          if (item.location !== 'Gymnasium Locker Room B') throw new Error('Location mismatch: ' + item.location);
          if (item.item_date !== '2026-11-24') throw new Error('Date mismatch: ' + item.item_date);
          if (!Array.isArray(item.images) || item.images.length !== 2) throw new Error('Expected 2 images in item.images');

          return `Item #${res.iid} saved with multi-photos, location "${item.location}", and date "${item.item_date}"`;
        }
      },
      {
        name: 'Claims: Compulsory Unique Identifying Secret Proof Validation',
        run: async () => {
          // 1. Missing secret proof should fail
          const emptyProofRes = await window.ClaimManager.submitClaim({
            item_id: 1,
            claimant_user_id: 99,
            claimant_name: 'John Doe',
            claimant_contact: '555-1234',
            claimant_email: 'john@example.com',
            claim_description: 'I lost my keys here',
            unique_details: '' // empty!
          });
          if (emptyProofRes.status === 'success') throw new Error('Submitting empty unique proof should have failed');

          // 2. Too short secret proof should fail
          const shortProofRes = await window.ClaimManager.submitClaim({
            item_id: 1,
            claimant_user_id: 99,
            claimant_name: 'John Doe',
            claimant_contact: '555-1234',
            claimant_email: 'john@example.com',
            claim_description: 'I lost my keys here',
            unique_details: 'keys' // < 5 chars
          });
          if (shortProofRes.status === 'success') throw new Error('Submitting short unique proof (<5 chars) should have failed');

          return 'Correctly enforced compulsory unique secret proof (minimum 5 characters)';
        }
      },
      {
        name: 'Claims: Founder Cannot Claim Own Item',
        run: async () => {
          // Create an item reported by user_id = 88
          const itemRes = await window.ItemManager.save({
            category_id: 1,
            user_id: 88,
            fullname: 'Founder User',
            title: 'Founder Item For Testing',
            contact: '555-9999',
            description: 'Item reported by founder 88',
            status: 1
          });

          // Attempt to claim by same user_id = 88
          const claimRes = await window.ClaimManager.submitClaim({
            item_id: itemRes.iid,
            claimant_user_id: 88,
            claimant_name: 'Founder User',
            claimant_contact: '555-9999',
            claimant_email: 'founder@example.com',
            claim_description: 'Claiming my own reported item',
            unique_details: 'Secret engraving 12345'
          });

          if (claimRes.status === 'success') throw new Error('Founder claiming own item should have been rejected');
          return 'Correctly prevented founder from filing claim on their own reported item';
        }
      },
      {
        name: 'Claims: End-to-End Verification, Address Submission, Desk Scheduling & Handover',
        run: async () => {
          // 1. Create and publish a test item
          const itemRes = await window.ItemManager.save({
            category_id: 2,
            user_id: 201,
            fullname: 'Finder Alice',
            title: 'Leather Wallet with Silver Monogram',
            contact: '555-0011',
            location: 'Science Complex Lobby',
            item_date: '2026-11-23',
            description: 'Brown leather wallet found under sofa',
            status: 1 // Published
          });
          const itemId = itemRes.iid;

          // 2. Claimant files claim with secret proof
          const claimantUserId = 202;
          const secretProof = 'Hidden $50 bill inside coin pocket and initials "J.B." stamped inside';
          const claimSubmitRes = await window.ClaimManager.submitClaim({
            item_id: itemId,
            claimant_user_id: claimantUserId,
            claimant_name: 'James Brown',
            claimant_contact: '555-8888',
            claimant_email: 'jbrown@example.com',
            claim_description: 'I dropped my leather wallet while rushing to physics lecture',
            unique_details: secretProof
          });
          if (claimSubmitRes.status !== 'success') throw new Error('Claim submission failed: ' + claimSubmitRes.msg);
          const claimId = claimSubmitRes.claim_id;

          // 3. Privacy Check: Unauthorized user must NOT see the secret proof
          const unauthorizedView = await window.ClaimManager.getClaimById(claimId, 999); // third party user 999
          if (unauthorizedView.unique_details !== '[Confidential - Admin Only]') {
            throw new Error('Secret proof was leaked to unauthorized user: ' + unauthorizedView.unique_details);
          }

          // Admin or claim owner CAN see the secret proof
          const adminView = await window.ClaimManager.getClaimById(claimId, 1); // admin user 1
          if (adminView.unique_details !== secretProof) {
            throw new Error('Admin could not see original secret proof');
          }

          // 4. Admin reviews and approves the claim
          const approveRes = await window.ClaimManager.approveClaim(claimId, 'Secret proof matches contents perfectly.');
          if (approveRes.status !== 'success') throw new Error('Claim approval failed: ' + approveRes.msg);

          let updatedClaim = await window.ClaimManager.getClaimById(claimId, 1);
          if (updatedClaim.status !== 'approved') throw new Error('Claim status must be approved, got: ' + updatedClaim.status);

          // Verify claimant received approval notification
          const claimantNotifs = await window.NotificationManager.getByUser(claimantUserId);
          const approvalNotif = claimantNotifs.find(n => n.type === 'claim_approved');
          if (!approvalNotif) throw new Error('Claimant did not receive claim_approved notification');

          // Item must STILL be status 1 (NOT marked returned yet)
          let itemCheck = await window.ItemManager.getById(itemId);
          if (Number(itemCheck.status) !== 1) throw new Error('Item should remain published (1) after claim approval, but was: ' + itemCheck.status);

          // 5. Claimant submits private contact & address
          const addressRes = await window.ClaimManager.submitContactAndAddress(claimId, claimantUserId, {
            claimant_address: '742 Evergreen Terrace, Springfield',
            id_proof_type: 'Driver License #DL-987654'
          });
          if (addressRes.status !== 'success') throw new Error('Address submission failed: ' + addressRes.msg);

          updatedClaim = await window.ClaimManager.getClaimById(claimId, 1);
          if (updatedClaim.status !== 'ready_for_scheduling') throw new Error('Claim status should be ready_for_scheduling, got: ' + updatedClaim.status);

          // 6. Admin assigns official collection desk
          const deskRes = await window.ClaimManager.assignCollectionLocation(claimId, {
            location_name: 'Main Campus Lost & Found Administrative Desk',
            address: 'Student Services Hall, Room 108',
            pickup_hours: 'Monday - Friday, 9:00 AM - 4:00 PM',
            instructions: 'Bring your physical Driver License and quote Claim #' + claimId
          });
          if (deskRes.status !== 'success') throw new Error('Desk assignment failed: ' + deskRes.msg);

          updatedClaim = await window.ClaimManager.getClaimById(claimId, 1);
          if (updatedClaim.status !== 'scheduled') throw new Error('Claim status should be scheduled, got: ' + updatedClaim.status);
          if (!updatedClaim.collection_location || updatedClaim.collection_location.location_name !== 'Main Campus Lost & Found Administrative Desk') {
            throw new Error('Assigned collection location mismatch');
          }

          // 7. Final Handover: Admin confirms physical handover
          const handoverRes = await window.ClaimManager.confirmHandover(claimId, 'Owner arrived in person, photo ID verified, item successfully handed over.');
          if (handoverRes.status !== 'success') throw new Error('Handover completion failed: ' + handoverRes.msg);

          updatedClaim = await window.ClaimManager.getClaimById(claimId, 1);
          if (updatedClaim.status !== 'completed') throw new Error('Claim status must be completed, got: ' + updatedClaim.status);

          // Item is now officially marked as Claimed / Returned (status 2)
          itemCheck = await window.ItemManager.getById(itemId);
          if (Number(itemCheck.status) !== 2) throw new Error('Item status must be 2 (Claimed/Returned), got: ' + itemCheck.status);

          // Item is no longer available for new claims
          const canClaimCheck = await window.ClaimManager.canItemBeClaimed(itemId);
          if (canClaimCheck.canClaim) throw new Error('Returned item should not be available for new claims');

          return `Lifecycle verified: Submitted -> Approved -> Address Provided -> Collection Scheduled -> Handed Over (Item #${itemId} marked Returned)`;
        }
      },
      {
        name: 'Claims: Rejection Workflow and History Retention',
        run: async () => {
          // 1. Create item
          const itemRes = await window.ItemManager.save({
            category_id: 1,
            user_id: 301,
            fullname: 'Finder Bob',
            title: 'Unclaimed Umbrella',
            contact: '555-7766',
            description: 'Red folding umbrella found near cafeteria',
            status: 1
          });

          // 2. Submit claim with invalid claim explanation
          const claimRes = await window.ClaimManager.submitClaim({
            item_id: itemRes.iid,
            claimant_user_id: 302,
            claimant_name: 'Suspicious User',
            claimant_contact: '555-0000',
            claimant_email: 'fake@example.com',
            claim_description: 'Looks like mine maybe',
            unique_details: 'It has blue stripes on the handle' // Doesn't match
          });
          const claimId = claimRes.claim_id;

          // 3. Admin rejects claim
          const rejectReason = 'Secret proof does not match: umbrella handle has no stripes and is plain black wooden handle.';
          const rejRes = await window.ClaimManager.rejectClaim(claimId, rejectReason);
          if (rejRes.status !== 'success') throw new Error('Rejection failed: ' + rejRes.msg);

          const rejectedClaim = await window.ClaimManager.getClaimById(claimId, 1);
          if (rejectedClaim.status !== 'rejected') throw new Error('Status should be rejected, got: ' + rejectedClaim.status);
          if (rejectedClaim.rejection_reason !== rejectReason) throw new Error('Rejection reason not stored properly');

          // Item should still remain published (status 1) for other rightful claimants
          const item = await window.ItemManager.getById(itemRes.iid);
          if (Number(item.status) !== 1) throw new Error('Item must remain Published (status 1) after false claim rejection');

          return 'Rejection workflow properly updated claim, recorded reason, notified claimant, and preserved item availability';
        }
      },
      {
        name: 'Catalog & Router: Published Items Retrieval and Filter Pipeline',
        run: async () => {
          const published = await window.ItemManager.getAll({ status: 1 });
          if (published.length === 0) throw new Error('Expected published items in database');

          // Verify all published items have valid category, title and status
          for (const item of published) {
            if (Number(item.status) !== 1) throw new Error('Item ' + item.id + ' status is not 1');
            if (!item.title) throw new Error('Item ' + item.id + ' missing title');
          }

          // Test Category Filter
          const cats = await window.CategoryManager.getAll(true);
          if (cats.length > 0) {
            const catItems = await window.ItemManager.getAll({ status: 1, categoryId: cats[0].id });
            for (const ci of catItems) {
              if (Number(ci.category_id) !== Number(cats[0].id)) {
                throw new Error('Category filter returned mismatched item');
              }
            }
          }

          return `Catalog pipeline verified: ${published.length} published items accessible with category and search filtering`;
        }
      },
      {
        name: 'Authentication State: Session Management and Profile Sync',
        run: async () => {
          // Log in
          const res = await window.AuthManager.login('admin', 'admin123');
          if (res.status !== 'success') throw new Error('Login failed: ' + res.msg);

          const cur = window.AuthManager.getCurrentUser();
          if (!cur || cur.username !== 'admin') throw new Error('Current user mismatch');
          if (!window.AuthManager.isAdmin()) throw new Error('Admin role not identified');

          // Verify session storage
          const stored = localStorage.getItem('lfis_user_session') || sessionStorage.getItem('lfis_user_session');
          if (!stored) throw new Error('Session was not persisted in storage');

          // Test logout
          window.AuthManager.logout();
          if (window.AuthManager.getCurrentUser() !== null) throw new Error('Logout did not clear session');

          return 'Auth state verified: Session properly created, persisted in storage, and cleared on logout';
        }
      }
    ];

    async function executeAllTests() {
      const tbody = document.getElementById('test-results');
      tbody.innerHTML = '';
      let passed = 0;
      let failed = 0;

      for (let i = 0; i < tests.length; i++) {
        const test = tests[i];
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${i + 1}</td>
          <td><b>${test.name}</b></td>
          <td><span class="badge bg-secondary">Running...</span></td>
          <td class="text-muted">In progress</td>
        `;
        tbody.appendChild(row);

        try {
          const detail = await test.run();
          row.querySelector('td:nth-child(3)').innerHTML = '<span class="badge bg-success">PASS</span>';
          row.querySelector('td:nth-child(4)').innerHTML = `<span class="text-success">${detail || 'OK'}</span>`;
          passed++;
          try {
            fetch('http://localhost:5500/?step_pass=' + (i+1));
          } catch(e){}
        } catch (err) {
          row.querySelector('td:nth-child(3)').innerHTML = '<span class="badge bg-danger">FAIL</span>';
          row.querySelector('td:nth-child(4)').innerHTML = `<span class="text-danger fw-bold">${err.message}</span>`;
          failed++;
          try {
            fetch('http://localhost:5500/?step_fail=' + (i+1) + '&err=' + encodeURIComponent(err.message));
          } catch(e){}
        }
      }

      const summary = document.getElementById('summary');
      let resultReport = '';
      if (failed === 0) {
        summary.className = 'alert alert-success py-2 fw-bold';
        summary.textContent = `All ${passed} test cases passed successfully! IndexedDB, Auth, and CRUD fully functional.`;
        resultReport = `SUCCESS_ALL_${passed}_TESTS_PASSED`;
      } else {
        summary.className = 'alert alert-danger py-2 fw-bold';
        summary.textContent = `${passed} passed, ${failed} failed. Please review errors.`;
        resultReport = `FAILURE_${failed}_FAILED`;
      }
      try {
        fetch('http://localhost:5500/?test_report=' + resultReport);
      } catch (e) {}
    }

    document.getElementById('run-btn').addEventListener('click', executeAllTests);
    window.addEventListener('load', executeAllTests);
  </script>
</body>
</html>
