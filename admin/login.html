<!DOCTYPE html>
<html lang="en" style="height: auto;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Lost and Found Information System</title>
  
  <!-- Favicons -->
  <link href="../uploads/logo.png" rel="icon">
  <link href="../assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/custom.css" rel="stylesheet">

  <style>
    body {
      background-image: url("../uploads/cover.png");
      background-size: cover;
      background-repeat: no-repeat;
      backdrop-filter: brightness(.7);
      overflow-x: hidden;
    }
    .logo img {
      max-height: 55px;
      margin-right: 25px;
    }
    .logo span {
      color: #fff;
      text-shadow: 0px 0px 10px #000;
    }
  </style>

  <!-- Scripts -->
  <script src="../assets/js/jquery-3.6.4.min.js"></script>
  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>

  <!-- Database & Logic -->
  <script src="../database/schema.js"></script>
  <script src="../database/seed.js"></script>
  <script src="../database/db.js"></script>
  <script src="../scripts/storage.js"></script>
  <script src="../scripts/otp.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/app.js"></script>
</head>
<body>
  <main>
    <div class="container">
      <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">

              <div class="d-flex justify-content-center py-4">
                <a href="../" class="logo d-flex align-items-center w-auto">
                  <img src="../uploads/logo.png" alt="Logo">
                  <span class="d-none d-lg-block text-center" data-sys-name>Lost and Found Information System</span>
                </a>
              </div><!-- End Logo -->

              <div class="card mb-3 w-100">
                <div class="card-body">
                  <div class="pt-4 pb-2">
                    <h5 class="card-title text-center pb-0 fs-4">Login to Your Account</h5>
                    <p class="text-center small">Enter your username & password to login</p>
                  </div>

                  <form class="row g-3 needs-validation" novalidate id="login-frm">
                    <div id="login-err-container"></div>
                    <div class="col-12">
                      <label for="yourUsername" class="form-label">Username</label>
                      <div class="input-group has-validation">
                        <span class="input-group-text" id="inputGroupPrepend">@</span>
                        <input type="text" name="username" class="form-control" id="yourUsername" required>
                        <div class="invalid-feedback">Please enter your username.</div>
                      </div>
                    </div>

                    <div class="col-12">
                      <label for="yourPassword" class="form-label">Password</label>
                      <input type="password" name="password" class="form-control" id="yourPassword" required>
                      <div class="invalid-feedback">Please enter your password!</div>
                    </div>

                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit">Login</button>
                    </div>

                    <div class="col-12 text-center">
                      <p class="small mb-0">Don't have an account? <a href="../register.html">Create an account</a></p>
                    </div>

                    <div class="col-12 mt-3">
                      <div class="alert alert-light border small mb-0 py-2">
                        <strong>Default Admin Credentials:</strong><br>
                        Username: <code>admin</code><br>
                        Password: <code>admin123</code>
                      </div>
                    </div>
                  </form>

                </div>
              </div>

            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    $(document).ready(async function() {
      await window.db.init();
      const sysInfo = await window.db.getSystemInfo();
      if (sysInfo) {
        if (sysInfo.name) {
          $('[data-sys-name]').text(sysInfo.name);
          document.title = 'Login | ' + sysInfo.name;
        }
        if (sysInfo.logo) {
          const logoUrl = window.StorageManager.getImageUrl(sysInfo.logo, '../uploads/logo.png', '../');
          $('.logo img').attr('src', logoUrl);
          $('link[rel="icon"]').attr('href', logoUrl);
        }
        if (sysInfo.cover) {
          const coverUrl = window.StorageManager.getImageUrl(sysInfo.cover, '../uploads/cover.png', '../');
          $('body').css('background-image', `url("${coverUrl}")`);
        }
      }

      // Pre-fill username if remembered
      const lastUser = localStorage.getItem('lfis_last_username');
      if (lastUser) {
        $('#yourUsername').val(lastUser);
      }

      $('#login-frm').on('submit', async function(e) {
        e.preventDefault();
        $('#login-err-container').empty();
        start_loader();

        const username = $('#yourUsername').val();
        const password = $('#yourPassword').val();

        if (!username || !password) {
          $('#login-err-container').html("<div class='alert alert-danger'><i class='bi bi-exclamation-triangle'></i> Please enter both username and password.</div>");
          end_loader();
          return;
        }

        const resp = await window.AuthManager.login(username, password);
        end_loader();

        if (resp.status === 'success') {
          window.location.replace('./');
        } else {
          $('#login-err-container').html("<div class='alert alert-danger'><i class='bi bi-exclamation-triangle'></i> Incorrect username or password.</div>");
          $('#yourUsername').addClass('is-invalid');
          $('#yourPassword').addClass('is-invalid');
          $('#yourUsername').focus();
        }
      });
    });
  </script>
</body>
</html>
