<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Lost and Found Information System</title>
  
  <!-- Favicons -->
  <link href="uploads/logo.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 50%, #0369A1 100%);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .auth-card {
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
      background: #FFFFFF;
    }
    .logo-container img {
      max-height: 44px;
    }
    .logo-container span {
      font-weight: 700;
      color: #1E40AF;
      font-size: 1.25rem;
    }
    .input-group-text {
      background-color: #F8FAFC;
      border: 1.5px solid #CBD5E1;
      border-right: none;
      color: #64748B;
    }
    .form-control {
      border: 1.5px solid #CBD5E1;
      padding: 0.65rem 0.95rem;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }
    .input-with-icon {
      border-left: none;
    }
  </style>

  <!-- Scripts -->
  <script src="assets/js/jquery-3.6.4.min.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>

  <!-- Database & Logic -->
  <script src="database/schema.js"></script>
  <script src="database/seed.js"></script>
  <script src="database/db.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/app.js"></script>
</head>
<body>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <!-- Header Branding -->
        <div class="text-center mb-3">
          <a href="./" class="logo-container d-inline-flex align-items-center text-decoration-none bg-white py-2 px-3 rounded-pill shadow-sm">
            <img src="uploads/logo.png" alt="LFIS Logo" class="me-2">
            <span data-sys-short-name>LFIS</span>
          </a>
        </div>

        <div class="card auth-card">
          <div class="card-body p-4">
            
            <div class="text-center mb-4">
              <h4 class="fw-bold text-dark mb-1">Sign In</h4>
              <p class="text-muted small mb-0">Access your Lost and Found account, claims, and reports</p>
            </div>

            <!-- Error/Success Alert Container -->
            <div id="login-err-container"></div>

            <!-- Already Logged In Notice (if active session exists) -->
            <div id="alreadyLoggedInBox" class="d-none">
              <div class="alert alert-info py-2 small mb-3">
                <i class="bi bi-info-circle me-1"></i> You are currently signed in as <strong id="activeUserLabel"></strong>.
              </div>
              <div class="d-grid gap-2">
                <a href="./?page=my-reports" class="btn btn-primary" id="btnContinueSession">
                  <i class="bi bi-speedometer2 me-1"></i> Go to My Reports & Claims
                </a>
                <button type="button" class="btn btn-outline-danger btn-sm" id="btnSwitchAccount">
                  <i class="bi bi-box-arrow-right me-1"></i> Sign Out / Switch Account
                </button>
              </div>
              <hr class="my-3">
              <div class="text-center small">
                <a href="./" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Return to Homepage</a>
              </div>
            </div>

            <!-- Login Form -->
            <form id="login-frm" class="needs-validation" novalidate>
              
              <!-- Email or Username Input -->
              <div class="mb-3">
                <label for="inputIdentifier" class="form-label fw-semibold small">Email or Username <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope-at text-muted"></i></span>
                  <input type="text" name="identifier" class="form-control input-with-icon" id="inputIdentifier" placeholder="name@example.com or username" required autofocus>
                </div>
                <div class="invalid-feedback">Please enter your email address or username.</div>
              </div>

              <!-- Password Input -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="inputPassword" class="form-label fw-semibold small mb-0">Password <span class="text-danger">*</span></label>
                </div>
                <div class="input-group mt-1">
                  <span class="input-group-text"><i class="bi bi-key text-muted"></i></span>
                  <input type="password" name="password" class="form-control input-with-icon" id="inputPassword" placeholder="Enter your password" required>
                  <button class="btn btn-outline-secondary border-start-0" type="button" id="btnTogglePassword" title="Show/Hide Password">
                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                  </button>
                </div>
                <div class="invalid-feedback">Please enter your password.</div>
              </div>

              <!-- Remember Me -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                  <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg shadow-sm" id="btnSubmitLogin">
                  <span class="spinner-border spinner-border-sm d-none me-2" id="loginSpinner" role="status"></span>
                  <i class="bi bi-box-arrow-in-right me-1" id="loginIcon"></i> Sign In
                </button>
              </div>

              <!-- Registration Link -->
              <div class="text-center pt-2 border-top">
                <p class="small text-muted mb-2">Don't have an account yet?</p>
                <a href="register.html" class="btn btn-outline-success btn-sm w-100 fw-semibold">
                  <i class="bi bi-person-plus me-1"></i> Create a New Account
                </a>
              </div>

              <!-- Admin Link & Home Link -->
              <div class="text-center mt-3 pt-2">
                <div class="small">
                  <a href="./" class="text-decoration-none text-secondary me-3"><i class="bi bi-house me-1"></i> Home</a>
                  <span class="text-muted">|</span>
                  <a href="admin/login.html" class="text-decoration-none text-secondary ms-3"><i class="bi bi-shield-lock me-1"></i> Admin Portal</a>
                </div>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    $(document).ready(async function() {
      await window.db.init();

      // Branding sync
      const sysInfo = await window.db.getSystemInfo();
      if (sysInfo) {
        if (sysInfo.name) {
          document.title = 'Sign In | ' + sysInfo.name;
        }
        if (sysInfo.short_name) {
          $('[data-sys-short-name]').text(sysInfo.short_name);
        }
        if (sysInfo.logo) {
          const logoUrl = window.StorageManager.getImageUrl(sysInfo.logo, 'uploads/logo.png');
          $('.logo-container img').attr('src', logoUrl);
          $('link[rel="icon"]').attr('href', logoUrl);
        }
        if (sysInfo.cover) {
          const coverUrl = window.StorageManager.getImageUrl(sysInfo.cover, 'uploads/cover.png');
          $('body').css('background-image', `url("${coverUrl}")`);
        }
      }

      // Check existing active session
      const currentUser = window.AuthManager.getCurrentUser();
      if (currentUser) {
        $('#activeUserLabel').text(`${currentUser.firstname} ${currentUser.lastname} (${currentUser.email || currentUser.username})`);
        $('#alreadyLoggedInBox').removeClass('d-none');
        $('#login-frm').addClass('d-none');
      }

      // Pre-fill remembered identifier
      const lastId = localStorage.getItem('lfis_last_identifier') || localStorage.getItem('lfis_last_username');
      if (lastId && !currentUser) {
        $('#inputIdentifier').val(lastId);
      }

      // Toggle Password Visibility
      $('#btnTogglePassword').on('click', function() {
        const passField = $('#inputPassword');
        const icon = $('#togglePasswordIcon');
        if (passField.attr('type') === 'password') {
          passField.attr('type', 'text');
          icon.removeClass('bi-eye').addClass('bi-eye-slash');
        } else {
          passField.attr('type', 'password');
          icon.removeClass('bi-eye-slash').addClass('bi-eye-erd');
        }
      });

      // Switch Account button
      $('#btnSwitchAccount').on('click', function() {
        window.AuthManager.logout('login.html');
      });

      // Form Submit
      $('#login-frm').on('submit', async function(e) {
        e.preventDefault();
        $('#login-err-container').empty();
        $('#inputIdentifier').removeClass('is-invalid');
        $('#inputPassword').removeClass('is-invalid');

        const identifier = $('#inputIdentifier').val().trim();
        const password = $('#inputPassword').val();

        if (!identifier) {
          $('#inputIdentifier').addClass('is-invalid').focus();
          return;
        }
        if (!password) {
          $('#inputPassword').addClass('is-invalid').focus();
          return;
        }

        // Show spinner
        $('#loginSpinner').removeClass('d-none');
        $('#loginIcon').addClass('d-none');
        $('#btnSubmitLogin').prop('disabled', true);

        try {
          const resp = await window.AuthManager.login(identifier, password);

          if (resp.status === 'success') {
            $('#login-err-container').html(`
              <div class="alert alert-success d-flex align-items-center py-2">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <div><strong>Success!</strong> Logging you in...</div>
              </div>
            `);

            // Parse URL redirect parameter if present
            const urlParams = new URLSearchParams(window.location.search);
            const redirectParam = urlParams.get('redirect');

            setTimeout(() => {
              if (redirectParam && !redirectParam.startsWith('http')) {
                window.location.replace(redirectParam);
              } else if (Number(resp.user.type) === 1) {
                // Admin redirect
                window.location.replace('admin/');
              } else {
                // Regular member redirect
                window.location.replace('index.html?page=my-reports');
              }
            }, 600);
          } else {
            $('#login-err-container').html(`
              <div class="alert alert-danger d-flex align-items-center py-2">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div>${resp.msg}</div>
              </div>
            `);
            if (resp.status === 'not_found') {
              $('#inputIdentifier').addClass('is-invalid').focus();
            } else {
              $('#inputPassword').addClass('is-invalid').focus();
            }
          }
        } catch (err) {
          console.error('Login error:', err);
          $('#login-err-container').html(`
            <div class="alert alert-danger py-2">
              <i class="bi bi-exclamation-octagon me-1"></i> An unexpected system error occurred. Please try again.
            </div>
          `);
        } finally {
          $('#loginSpinner').addClass('d-none');
          $('#loginIcon').removeClass('d-none');
          $('#btnSubmitLogin').prop('disabled', false);
        }
      });
    });
  </script>
</body>
</html>
